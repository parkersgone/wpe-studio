<?xml version="1.0" encoding="UTF-8"?>
<!-- Tray icon. The panel's other icons are flat monochrome glyphs on a 16px
     grid; the app's own logo is a saturated blue square and read as a sticker
     next to them. "symbolic" in the GTK sense: one colour, thin strokes, sized
     to sit on the same baseline as everything else in the tray. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g fill="none" stroke="#bebebe" stroke-width="1.25"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="1.5" y="3" width="13" height="8.6" rx="1.4"/>
    <path d="M5.6 13.7h4.8"/>
    <circle cx="8" cy="7.3" r="2.35"/>
  </g>
  <circle cx="8" cy="7.3" r="0.85" fill="#bebebe"/>
</svg>
